<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nightcore</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-row">
      <span class="title">NIGHTCORE</span>
      <label class="toggle" title="Enable / disable">
        <input type="checkbox" id="enabled" aria-label="Enable nightcore">
        <span class="slider"></span>
      </label>
    </div>
    <p class="subtitle">Speed · Pitch · Bass</p>
  </div>

  <div class="section dimmed" id="controls">
    <div class="row">
      <span class="label" id="speed-label">Speed</span>
      <div class="btn-group" role="group" aria-labelledby="speed-label">
        <button type="button" class="speed-btn" data-speed="1.25" aria-pressed="false">1.25×</button>
        <button type="button" class="speed-btn" data-speed="1.5" aria-pressed="false">1.5×</button>
      </div>
    </div>

    <div class="row">
      <label class="label" for="bass">Bass boost</label>
      <div class="bass-row">
        <input type="range" id="bass" min="0" max="12" step="1" value="6">
        <output class="bass-val" id="bass-val" for="bass">6 dB</output>
      </div>
    </div>
  </div>

  <script src="../common/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
